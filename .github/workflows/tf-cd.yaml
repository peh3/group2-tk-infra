name: Terraform CD
run-name: Running Terraform CD by ${{ github.actor }}

on:
  # push:
  #   branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write       # Required for OIDC
  contents: read        # To read repo content

jobs:
  CD:
    runs-on: ubuntu-latest
    # 1. Tell GitHub to pull variables from 'prod' or 'staging' Environment based on branch
    environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    
    # 2. Create a local variable so we don't have to type this expression on every line
    env:
      TF_ENV: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    defaults:
      run:
        # Tells GitHub Actions to run every command in this folder
        working-directory: ./terraform

    steps:
    - name: Checkout
      uses: actions/checkout@v4
   
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.OIDC_ROLE }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4

    - name: Terraform fmt
      run: terraform fmt -check

    - name: Terraform Init
      run: terraform init -backend-config=${{ env.TF_ENV }}.s3.tfbackend
       
    - name: Terraform Validate
      run: terraform validate

    - uses: terraform-linters/setup-tflint@v3
      with:
        tflint_version: latest
   
    - name: Show version
      run: tflint --version

    - name: Init TFLint
      run: tflint --init

    - name: Run TFLint
      run: tflint -f compact
   
    - name: Terraform Plan
      run: terraform plan -var-file=${{ env.TF_ENV }}.tfvars

    - name: Terraform Apply
      run: terraform apply -var-file=${{ env.TF_ENV }}.tfvars --auto-approve
