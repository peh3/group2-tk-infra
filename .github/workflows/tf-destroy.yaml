name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  id-token: write       # Required for AWS OIDC authentication
  contents: read        # Required to read repository code

jobs:
  destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest
    # Target the environment selected in the dropdown
    environment: ${{ inputs.environment }}
    
    env:
      # Use the selected dropdown value as the file prefix
      TF_ENV: ${{ inputs.environment }}
    defaults:
      run:
        # Tells GitHub Actions to run every command in this folder
        working-directory: ./terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inspect Workspace and Files
        run: |
          echo "Current working directory:"
          pwd
          echo "Listing all files in this directory:"
          ls -la
          echo "Finding all .tf files:"
          find . -name "*.tf"

      - name: Terraform Init
        run: terraform init -backend-config=${{ env.TF_ENV }}.s3.tfbackend

      - name: Terraform Plan for Destroy
        run: terraform plan -destroy -var-file=${{ env.TF_ENV }}.tfvars

      - name: Terraform Destroy
        run: terraform destroy -var-file=${{ env.TF_ENV }}.tfvars --auto-approve