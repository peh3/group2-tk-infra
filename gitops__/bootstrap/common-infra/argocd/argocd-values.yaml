## bootstrap/common-infra/argocd/argocd-values.yaml

# 1. API Server Metrics & Ingress
server:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    hostname: group2-tk-argocd.sctp-sandbox.com
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: argocd-server-tls
        hosts:
          - group2-tk-argocd.sctp-sandbox.com
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false # Keep false during init.sh; created via GitOps once Prometheus exists

# 2. Repo Server Metrics
repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

# 3. Application Controller Metrics (Reconciliation performance)
controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

# 4. Dex SSO Server Metrics
dex:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false