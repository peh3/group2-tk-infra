apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sre-project
  namespace: argocd
spec:
  description: Platform Infrastructure, Ingress, and Observability
  sourceRepos:
    - https://github.com/peh3/group2-tk-infra.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
  destinations:
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: ingress-nginx
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: external-dns
      server: https://kubernetes.default.svc
  # SRE requires cluster-scoped permissions for CRDs and metrics scrapers
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'