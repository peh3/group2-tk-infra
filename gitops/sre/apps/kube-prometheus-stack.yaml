apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sre-project
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.1.1
    helm:
      valueFiles:
        - $values/gitops/sre/apps/kube-prometheus-stack-values.yaml
        - $values/gitops/sre/apps/grafana-dashboards.yaml
  sources:
    # 1. The remote Helm chart source
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.1.1
      helm:
        valueFiles:
          - kube-prometheus-stack-values.yaml
          - grafana-dashboards.yaml
    # 2. Your Git repository source where the values files live
    - repoURL: https://github.com/peh3/group2-tk-infra.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true