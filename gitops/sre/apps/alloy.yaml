apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io  # FIXED: Array indentation
spec:
  project: sre-project
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 0.11.0
    helm:
      valuesObject:
        controller:
          type: daemonset
        alloy:
          configMap:
            create: true
            content: |
              // 1. Discover all pods on the local node for metrics and logs
              discovery.kubernetes "pods" {
                role = "pod"
              }

              // 2. SCRAPE METRICS: Scrape Prometheus metrics from annotated pods
              prometheus.scrape "pod_metrics" {
                targets    = discovery.kubernetes.pods.targets
                forward_to = [prometheus.remote_write.local.receiver]
              }

              // 3. EXPORT METRICS: Send metrics to your in-cluster Prometheus service
              prometheus.remote_write "local" {
                endpoint {
                  url = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
                }
              }

              // 4. COLLECT LOGS: (Your existing log collection)
              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets
                
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
              }

              loki.source.kubernetes "local_pods" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.local.receiver]
              }

              loki.write "local" {
                endpoint {
                  url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true  # FIXED: Array indentation