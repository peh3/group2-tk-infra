apiVersion: v1
kind: ServiceAccount
metadata:
  name: swiftkart-collector-collector
  namespace: opentelemetry-system
---
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: swiftkart-collector
  namespace: opentelemetry-system
spec:
  config: |
    exporters:
      otlp:
        endpoint: tempo.logging.svc.cluster.local:4317
        tls:
          insecure: true
    processors:
      batch: {}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    service:
      pipelines:
        traces:
          exporters:
            - otlp
          processors:
            - batch
          receivers:
            - otlp
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888