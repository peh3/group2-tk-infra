apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # Deploy before Grafana Alloy (which depends on it)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sre-project
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.5.0  # Or your desired chart version
    helm:
      valuesObject:
        # 1. Use the production-standard deployment mode
        deploymentMode: SimpleScalable
        
        loki:
          auth_enabled: false

          # ADD THIS ENTIRE BLOCK:
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: index_
                  period: 24h
                  
        # 2. Allow the chart to provision MinIO for S3-compatible local storage
        minio:
          enabled: true
          
        # 3. Chart defaults will automatically spin up Read, Write, and Backend replicas
        read:
          replicas: 2
        write:
          replicas: 2
        backend:
          replicas: 1

  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true