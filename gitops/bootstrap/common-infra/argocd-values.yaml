server:
  ingress:
    enabled: true
    ingressClassName: cilium
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hostname: group2-tk-argocd.sctp-sandbox.com
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: argocd-server-tls
        hosts:
          - group2-tk-argocd.sctp-sandbox.com
  metrics:
    enabled: true

repoServer:
  metrics:
    enabled: true

controller:
  metrics:
    enabled: true