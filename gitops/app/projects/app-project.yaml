apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: app-project
  namespace: argocd
spec:
  description: Application microservices and retail workloads
  sourceRepos:
    - https://github.com/peh3/group2-tk-infra.git
  destinations:
    - namespace: default
      server: https://kubernetes.default.svc
    - namespace: retail
      server: https://kubernetes.default.svc
  # Deny all cluster-scoped resources (ClusterRole, StorageClass, Node, CRDs)
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ''
      kind: 'ConfigMap'
    - group: ''
      kind: 'Secret'
    - group: ''
      kind: 'Service'
    - group: 'apps'
      kind: 'Deployment'
    - group: 'apps'
      kind: 'StatefulSet'
    - group: 'networking.k8s.io'
      kind: 'Ingress'
    - group: 'monitoring.coreos.com'
      kind: 'ServiceMonitor'