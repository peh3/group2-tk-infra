apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - group2-tk-argocd.sctp-sandbox.com
      secretName: argocd-server-tls
  rules:
    - host: group2-tk-argocd.sctp-sandbox.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: https  # Changed from number to name