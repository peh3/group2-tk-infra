global:
  domain: group2-tk-argocd.sctp-sandbox.com

server:
  extraArgs:
    - --insecure # Let Ingress-NGINX handle TLS termination

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    hostname: group2-tk-argocd.sctp-sandbox.com
    tls:
      - secretName: group2-tk-argocd-tls
        hosts:
          - group2-tk-argocd.sctp-sandbox.com

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true # Scraped by kube-prometheus-stack

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

applicationSet:
  enabled: true